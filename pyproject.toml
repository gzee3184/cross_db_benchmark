[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crossdb"
version = "0.1.0"
description = "Cross-Paradigm Text-to-Database Engine (Relational SQLite and Document MongoDB)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CrossDB Team" }]
dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "pymongo>=4.0.0",
    "sentence-transformers>=2.2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crossdb*"]
